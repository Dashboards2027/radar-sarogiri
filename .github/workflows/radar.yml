name: Radar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["radar.db", "data.js", "explanations.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Buscar tendencias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_API }}
        run: python collect.py

      - name: Guardar historial
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          touch explanations.json && git add radar.db data.js explanations.json
          git diff --cached --quiet || git commit -m "Actualizar tendencias"
          git pull --rebase -X theirs || true  # in a rebase, "theirs" = this run's fresh data
          git push

      - name: Armar sitio
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp data.js _site/data.js
          cp clients.js _site/clients.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
